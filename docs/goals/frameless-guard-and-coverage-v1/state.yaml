# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Frameless guard hardening and drag coverage"
  slug: "frameless-guard-and-coverage-v1"
  kind: specific
  status: active
  tranche: >-
    Close the citation guard's rename/delete blind spot, extend its sweep to the two lane file
    types it cannot read, measure the drag in a second browser or qualify every claim, and
    correct the last two stale records.
  oracle:
    signal: >-
      THREE PARTS, ALL REQUIRED. (1) EVERY GUARD CHANGE IS PROVEN RED-CAPABLE AGAINST A REAL
      FAILURE AND THE PROOF RE-RUNS IN CI - mutate the detector, show the suite go RED, restore
      BYTE-IDENTICALLY, report the digest both times. `pnpm check:citations` EXITING 0 ON A CLEAN
      TREE IS NOT EVIDENCE: the previous board proved a NEUTERED detector still prints "agreed
      with the prose" and exits 0. (2) THE DRAG CLAIM NAMES ITS BROWSER OR IS MEASURED IN A SECOND
      ONE - either Firefox is driven and recorded PER LANE, or every drag claim in the repo is
      QUALIFIED AS CHROMIUM. "It works in Chromium" MAY NOT BE WRITTEN AS "it works". (3) NOTHING
      REGRESSES: pnpm test at EXACTLY ONE failure; pnpm e2e stays 6 x 9 RUN ALONE; lint and
      check:citations clean. pnpm check BASELINE 261, may rise only on a card stating the amount
      IN ADVANCE.
    cadence: "after each card, and at final audit"
    final_proof: >-
      Per guard change, the mutation and its restore digest; per lane, the Firefox result or the
      qualified claim; the check budget's start and end with every rise attributed.
  intake:
    original_request: >-
      The PM listed what remained after frameless-app-fidelity-v1 closed complete. The owner
      answered "Fix them all."
    interpreted_outcome: >-
      The guard's rename/delete hole closed and proven red; .svelte/.vue prose swept; the drag
      measured in Firefox or every claim qualified; two stale records corrected.
    input_shape: specific
    proof_type: test
    completion_proof: >-
      A mutation proof per guard change, a per-lane Firefox result or a qualified claim, and the
      three machine gates green.
    likely_misfire: >-
      SHIPPING A GUARD CHANGE THAT LOOKS RIGHT AND HAS NEVER BEEN SHOWN TO FAIL. The previous
      board caught SIX vacuous instruments, two of them the PM's own.

active_task: T001

# ---------------------------------------------------------------------------
# KNOWN WORKING-TREE DIRT - NOT OURS. DO NOT "CLEAN UP", DO NOT `git add -A`.
# `M pnpm-lock.yaml`, `M pnpm-workspace.yaml`, `?? website/` are the OWNER'S
# in-flight work. Fingerprints, `shasum -a 256` sorting whole output LINES:
# f326d314 / aeb7edc1 / f936e169 over 116 website files. Every card checks them
# at START and FINISH and they must be IDENTICAL.
# ---------------------------------------------------------------------------

rules:
  - "state.yaml is board truth; goal.md is the charter."
  - "Exactly one active task unless disjoint write scopes are proven."
  - "Scout and Judge are READ-ONLY. Workers write only inside allowed_files and run their verify."
  - "Every completed, blocked or escalated task gets a receipt."
  - "The goal completes only through a final Judge audit recording full_outcome_complete: true."
  - "MEASURE, NEVER INHERIT. Twelve cards on the predecessor board exceeded their brief's count."
  - "AN INSTRUMENT NEVER SHOWN TO FAIL IS WORTHLESS. Six vacuous proofs were caught on the last board."

agents:
  scout: installed
  judge: installed
  worker: installed

visual_board:
  enabled: false

tasks:
  - id: T001
    type: worker
    assignee: Worker
    status: active
    reasoning_hint: high
    objective: >-
      CLOSE THE CITATION GUARD'S RENAME/DELETE BLIND SPOT. A citation to a path that does not
      exist is silently ruled NOT-FIRST-PARTY and escapes every ruling, so the moment a cited file
      is renamed or deleted, every citation pointing at it STOPS BEING CHECKED - silently, with
      the check still green.
    THE_PM_MEASURED_THIS_AT_HEAD: >-
      Planted a citation to `packages/compiler/src/totally-not-a-real-file.ts:42` in
      scripts/demo.mjs and ran the guard: EXIT 0. Restored byte-identically: EXIT 0. The hole is
      at scripts/check-citations.mjs:830 - `resolvesInRepo` calls existsSync ONLY TO CLASSIFY.
    WHY_THIS_IS_THE_BIGGEST_ITEM: >-
      The previous board moved THE REPO'S ENTIRE RECORD INTEGRITY onto this check. A blind spot
      that WIDENS WITH EVERY FUTURE RENAME is the one item where doing nothing degrades over time.
    allowed_files:
      - "scripts/check-citations.mjs"
      - "packages/compiler/test/citations.test.ts"
      - "docs/goals/frameless-guard-and-coverage-v1/notes/T001-dangling-citations.md"
    verify:
      - "SWEEP FIRST AND REPORT YOUR OWN COUNT: how many citation-shaped tokens in the repo point at a path that DOES NOT EXIST? Enumerate them before changing behaviour. IF THE ANSWER IS NOT ZERO, EVERY ONE IS EITHER A REAL STALE CITATION OR A DELIBERATE REFERENCE NEEDING AN EXEMPTION - rule each BY NAME."
      - "THE FIX IS CLASSIFY-THEN-FAIL, NOT CLASSIFY-THEN-SKIP. A citation-shaped token whose path looks first-party (not absolute, not node_modules) but does not resolve MUST be a violation, with a NAMED exemption list for deliberate references. EXEMPTIONS MUST BE EXISTENCE-CHECKED THEMSELVES - a dangling exemption is the same bug one level up, and the previous board hit exactly that."
      - "RED-CAPABILITY PROOF, MANDATORY: plant a citation to a NON-EXISTENT first-party path, show `pnpm check:citations` FAILING and NAMING file:line, then restore BYTE-IDENTICALLY and show it passing. Report the sha256 both times."
      - "PORT THE PLANTS INTO packages/compiler/test/citations.test.ts asserting the FIRING SITE, driven off a SYNTHETIC fixture in a temp dir - NEVER off repository prose, which a future fix will change."
      - "MUTATION PROOF: break your new detector so it returns no problems, show the ported tests GOING RED while `pnpm check:citations` STILL EXITS 0. Restore byte-identically. Report the guard's digest both times. THIS IS THE POINT OF THE CARD."
      - "NEGATIVE CONTROLS: a citation to an EXISTING path must NOT fire; a THIRD-PARTY reference (absolute path, node_modules, a URL, a bare package name) must NOT fire; and prove the third-party branch is still reachable rather than dead."
      - "pnpm check:citations must still sweep AT LEAST 4 watched documents / 17 watched source files / 610 swept files. Report BEFORE and AFTER, and the timing."
      - "THIS CARD DERIVES NOTHING. git diff --exit-code over EVERY derived tree, EACH ASSERTED TO EXIST AND BE NON-EMPTY FIRST, paired with git status --short. *** NEVER USE A WILDCARD PATHSPEC *** - git disables leading-directory matching once a pathspec contains a wildcard, so `git diff -- 'demos/*/src/emitted'` MATCHES NOTHING AND EXITS CLEAN. USE A SHELL ARRAY."
      - "pnpm check BASELINE 261 PREDICTED DELTA 0, MEASURE START YOURSELF at HEAD by stashing your own paths BY NAME / pnpm test - state passed BEFORE and AFTER, rise by exactly the tests you add, failures STILL EXACTLY 1 / pnpm e2e 6 x 9 RUN ALONE / pnpm lint."
      - "fingerprint the owner's three dirty paths at START and FINISH with `shasum -a 256`, sorting whole output LINES: f326d314 / aeb7edc1 / f936e169, 116 files."
    stop_if:
      - "Need files outside allowed_files."
      - "You are about to ship a guard change WITHOUT a mutation showing your own tests RED. AN INSTRUMENT NEVER SHOWN TO FAIL IS WORTHLESS - the previous board proved a NEUTERED detector still prints 'agreed with the prose' and exits 0."
      - "You are about to add an exemption that is NOT itself existence-checked."
      - "You are about to make check:citations sweep FEWER files than it does at HEAD."
      - "You are about to 'fix' a real stale citation your sweep finds. RULE IT AND REPORT IT - correcting prose outside allowed_files is another card."
      - "You are about to weaken any EXISTING ruling to make the suite pass."
      - "You are about to edit a .tsrx fixture. NONE IS IN SCOPE, and a byte-length change moves the checked-in golden while the derivation proof is STRUCTURALLY BLIND to it - only pnpm test catches it."
      - "pnpm check rises at all. BASELINE 261, PREDICTED DELTA 0."
      - "pnpm test failures exceed exactly 1, or pnpm e2e leaves 6 x 9."
      - "Any dependency is added, or pnpm-lock.yaml / pnpm-workspace.yaml / website/ is touched. DO NOT `git add -A`."
      - "NEVER pkill -f. Stop only what you start, BY ITS RECORDED PID."
      - "Verification fails twice for the same reason."
    receipt: null

